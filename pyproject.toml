[project]
name = "react-agent-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yadukrishnan m", email = "yadukrishnan152@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jupyter>=1.1.1",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.1",
    "notebook>=7.6.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
react-agent-project = "react_agent_project:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
